  </g>
  <text x="1265.0" y="349.8" fill="rgba(255,255,255,0.95)" font-family='"IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace' font-size="26" font-weight="500"
        letter-spacing="3.12" text-anchor="end" dominant-baseline="hanging"><tspan x="1265.0" dy="0">PARSE THE LANGUAGE.</tspan><tspan x="1265.0" dy="1.35em">OWN THE AST.</tspan></text>
