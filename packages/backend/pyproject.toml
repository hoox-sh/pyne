[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hoox-pyne-backend"
dynamic = ["version"]
description = "PYNE Pro API backend (Flask) for the HOOX open trading stack"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
keywords = ["pyne", "pynescript", "flask", "pro-api", "hoox", "tradingview"]
authors = [
  { name = "jango_blockchained" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "hoox-pyne[pro]",
]

[project.urls]
Homepage = "https://hoox.sh/pyne"
Documentation = "https://hoox.sh/pyne/docs"
Repository = "https://github.com/hoox-sh/pyne"
Issues = "https://github.com/hoox-sh/pyne/issues"

[project.scripts]
pyne-backend = "backend.app:main"

[tool.hatch.version]
path = "../../src/pynescript/__about__.py"

# The backend source lives at the repo root (`backend/`), one level above this
# packaging directory. `force-include` maps it into the wheel as `backend`.
[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.wheel.force-include]
"../../backend" = "backend"

[tool.hatch.build.targets.wheel.exclude]
paths = ["**/__pycache__"]
