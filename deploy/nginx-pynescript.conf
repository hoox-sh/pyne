# TLS origin for pynescript.online. Installed by scripts/deploy_vps.sh.
# ACME HTTP-01 stays on :80. API/datafeed/mcp bind 127.0.0.1 only.

upstream pyne_api {
    server 127.0.0.1:5002 fail_timeout=0;
}

upstream pyne_datafeed {
    server 127.0.0.1:5004 fail_timeout=0;
}

upstream pyne_mcp {
    server 127.0.0.1:5003 fail_timeout=0;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name pynescript.online www.pynescript.online _;
    server_tokens off;

    # ACME HTTP-01 must stay on :80 or certbot renewal breaks.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name pynescript.online www.pynescript.online _;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/pynescript.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pynescript.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 32m;

    location ^~ /scripts {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://pyne_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location ^~ /cron {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://pyne_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /ws/ {
        proxy_pass http://pyne_api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Dedicated datafeed process — RAM sessions must stay on this upstream.
    location /datafeed/ {
        proxy_pass http://pyne_datafeed/datafeed/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # MCP streamable-http. Localhost only: the container holds ADMIN_TOKEN
    # for runner tools. Language tools remain available on 127.0.0.1:5003.
    location ^~ /mcp {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://pyne_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://pyne_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
