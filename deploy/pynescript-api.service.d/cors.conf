# Drop-in for pynescript-api.service: production CORS allowlist.
# Short list is enough: pyne always appends localhost + PRODUCT_ORIGIN_RE
# (*.hoox.sh, *.pynescript.ai, *.pynescript.online, *.pynescript-axis.pages.dev).

[Service]
Environment="ALLOWED_ORIGINS=https://pynescript.online,https://axis.hoox.sh,https://hoox.sh"
