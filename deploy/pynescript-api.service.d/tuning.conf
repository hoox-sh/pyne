#
# Performance tuning drop-in for pynescript-api.service (Hetzner VPS).
# Installed by scripts/deploy_vps.sh alongside cors.conf.
# Local-only drop-ins (oauth.conf, runner.conf) are NOT versioned and are
# left untouched by deploys.
#
# --max-requests is load-bearing, not tuning trivia (2026-10-03 outage):
# a stale tuning.conf without it overrode the base unit's recycling, two
# gevent workers grew to 1.8 GB + 1.0 GB, swap hit 100%, gunicorn logged
# repeated WORKER TIMEOUT + SIGKILL "Perhaps out of memory?", and even
# GET /health timed out (code=000 after 20s). Keep recycling here AND in
# the base unit so a stale drop-in can never disable it again.

[Service]
# Use both vCPUs. --preload shares app imports + interpreter pages across
# workers (CoW), keeping RSS well under budget.
# NOTE: keep ExecStart in sync with deploy/pynescript-api.service (base unit).
# The drop-in wins on conflict — both must contain --max-requests.
ExecStart=
ExecStart=/root/pynescript/.venv/bin/gunicorn -k gevent -w 2 --preload -b 127.0.0.1:5002 --timeout 180 --graceful-timeout 30 --keep-alive 15 --worker-connections 1000 --max-requests 200 --max-requests-jitter 50 --access-logfile - --error-logfile - backend.app:app

# Soft memory ceiling: throttle before swap thrash; hard kill avoided.
MemoryHigh=2800M

# Hardening additions
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true
MemoryDenyWriteExecute=false
RestrictRealtime=true
SystemCallArchitectures=native
