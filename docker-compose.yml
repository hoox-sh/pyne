#
# Local development stack for the PYNE Pro API.
#
#   docker compose up --build api
#   docker compose --profile redis up --build
#   docker compose --profile lsp run --rm lsp
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Host port defaults to 5002 (AXIS / local docs expect the API there).

name: pynescript

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-dev
      args:
        PYNESCRIPT_VERSION: ${PYNESCRIPT_VERSION:-0.2.0}
        GIT_SHA: ${GIT_SHA:-dev}
    image: pynescript-api:dev
    ports:
      - "${API_PORT:-5002}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      FLASK_ENV: development
      FLASK_DEBUG: "${FLASK_DEBUG:-1}"
      API_KEY_STORE: /data/api_keys.json
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://hoox.sh,https://hoox.sh/axis,http://localhost:8081,http://127.0.0.1:8081}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PYTHONPATH: /app/src:/app
    volumes:
      - ./src:/app/src:ro
      - ./backend:/app/backend:ro
      - api_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - pynescript
    # When the redis profile is active, wait for it; otherwise ignore.
    depends_on:
      redis:
        condition: service_healthy
        required: false

  redis:
    image: redis:7-alpine
    profiles:
      - redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - pynescript

  lsp:
    build:
      context: .
      dockerfile: Dockerfile
      target: lsp
      args:
        PYNESCRIPT_VERSION: ${PYNESCRIPT_VERSION:-0.2.0}
        GIT_SHA: ${GIT_SHA:-dev}
    image: pynescript-lsp:latest
    profiles:
      - lsp
    environment:
      PYTHONPATH: /app/src:/app
    volumes:
      - ./src:/app/src:ro
    # stdio language server — use `docker compose run --rm lsp` for interactive
    stdin_open: true
    tty: false
    networks:
      - pynescript

volumes:
  api_data:
  redis_data:

networks:
  pynescript:
    name: pynescript-dev
