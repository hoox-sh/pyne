[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI distribution name (import package remains `pynescript`).
# `pynescript` is taken by elbakramer; plain `pyne`/`PyNE` is taken by an
# unrelated 0.1.0 process-networking library — ship as hoox-pyne.
name = "hoox-pyne"
dynamic = ["version"]
description = "PYNE — parse, evaluate, and LSP for TradingView® Pine Script™ (HOOX open trading stack)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
keywords = ["python", "tradingview", "pinescript", "pyne", "hoox", "lsp"]
authors = [
  { name = "jango_blockchained" },
]
maintainers = [
  { name = "jango_blockchained" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Compilers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "antlr4-python3-runtime>=4.13.1",
  "click>=8.1.7",
  "requests",
  "tqdm",
]

[project.optional-dependencies]
lsp = [
  "pygls>=2.0.0",
  "lsprotocol>=2024.0.0",
]
dev-lsp = [
  "pygls>=2.0.0",
  "lsprotocol>=2024.0.0",
  "pytest-lsp>=0.1.0",
]
data = [
  "ccxt>=4.0.0",
]
datafeed = [
  "ccxt>=4.0.0",
]
# Numba JIT path for Runtime.run(mode="compile"|"auto") / AXIS Execution mode
compile = [
  "numpy>=1.26.0",
  "numba>=0.59.0",
]
# Pro API stack (Flask + compile path + optional Redis key store)
pro = [
  "flask>=3.0.0",
  "flask-cors>=4.0.0",
  "flask-sock>=0.7.0",
  "simple-websocket>=1.0.0",
  "numpy>=1.26.0",
  "numba>=0.59.0",
  "matplotlib>=3.8.0",
  "gunicorn>=21.0.0",
  "redis>=5.0.0",
]

[project.urls]
Homepage = "https://hoox.sh/pyne"
Documentation = "https://hoox.sh/pyne/docs"
Repository = "https://github.com/hoox-sh/pyne"
Issues = "https://github.com/hoox-sh/pyne/issues"
Changelog = "https://github.com/hoox-sh/pyne/blob/main/CHANGELOG.md"

[project.scripts]
pynescript = "pynescript.__main__:cli"
pynescript-lsp = "pynescript.langserver.__main__:main"

[project.entry-points."pygments.lexers"]
pinescript = "pynescript.ext.pygments.lexers:PinescriptLexer"

[tool.hatch.version]
path = "src/pynescript/__about__.py"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/.opencode",
  "/.private",
  "/brand",
  "/docs/exports",
  "/docs/_build",
  "/logs",
  "/reports",
  "/vscode-extension/node_modules",
  "/pine-worker/node_modules",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pynescript"]

[tool.hatch.envs.test]
dependencies = [
  "coverage[toml]>=7.4.2",
  "pytest>=8.0.1",
  "pytest-cov>=4.1.0",
  "pytest-xdist>=3.5.0",
  "flask>=3.0.0",
  "flask-cors>=4.0.0",
  "flask-sock>=0.7.0",
  "simple-websocket>=1.0.0",
  "gunicorn>=21.0.0",
  "matplotlib>=3.8.0",
  "redis>=5.0.0",
  "lsprotocol>=2024.0.0",
  "pygls>=2.0.0",
  "pytest-lsp>=0.1.0",
  "numpy>=1.26.0",
  "numba>=0.59.0",
]
[tool.hatch.envs.test.scripts]
test = [
  "pytest {args}",
]
test-cov = [
  "pytest -n auto -d --cov=src/pynescript --cov=tests --cov-report=term --cov-report=lcov {args:tests}",
]
cov = [
  "coverage run -m pytest {args:tests}",
  "coverage combine",
  "coverage lcov",
  "coverage report",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12"]

[tool.hatch.envs.lint]
detached = true
dependencies = [
  "antlr4-cli",
  "black>=24.2.0",
  "mypy>=1.8.0",
  "pyasdl>=0.3.1",
  "ruff>=0.2.2",
]
[tool.hatch.envs.lint.scripts]
gen-parser = "antlr4 {args}"
style = "ruff check {args}"
typing = "mypy --install-types --non-interactive {args:src/pynescript tests}"
format = "ruff format {args}"

[tool.hatch.envs.docs]
detached = true
dependencies = [
  "furo>=2024.1.29",
  "myst-parser>=2.0.0",
  "pygments>=2.17.2",
  "sphinx>=7.2.6",
  "sphinx-click>=5.1.0",
  "sphinx-autobuild>=2024.2.4",
  "antlr4-python3-runtime>=4.13.1",
]

[tool.hatch.envs.docs.scripts]
build = [
  "sphinx-build docs docs/_build",
]

[tool.pytest.ini_options]
markers = [
  "interp_compile_full: longer interpret vs compile parity subset (optional)",
]

[tool.black]
target-version = ["py310"]
line-length = 120
skip-string-normalization = true

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  "generated",
]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  "ISC001",
  "S311",
  "ARG002",
]

[tool.ruff.lint.isort]
known-first-party = ["pynescript"]
force-single-line = true
lines-between-types = 1
lines-after-imports = 2
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ARG001", "C901", "F841", "PLR0912", "PLR2004", "S101", "T201", "TID252", "PLC0415"]
"src/pynescript/__main__.py" = ["ARG001", "EM101", "PLR0913", "B904", "PLC0415"]
"src/pynescript/util/data.py" = ["DTZ005", "B904", "PLC0415"]
"src/pynescript/ast/helper.py" = ["C901", "PLC0415", "PLR1704"]
"src/pynescript/ast/type_system.py" = ["FBT001", "FBT002"]
# Magic numbers intentional for Pine drawing style constants, array indices etc.
"src/pynescript/ast/evaluator/builtins/drawing.py" = ["PLR2004"]
"src/pynescript/ast/evaluator/builtins/arrays.py" = ["PLR2004"]
"src/pynescript/ast/evaluator/builtins/technical.py" = ["PLR2004"]
"src/pynescript/ast/evaluator/builtins/strategy.py" = ["PLR2004"]
"src/pynescript/ast/evaluator/builtins/alerts.py" = ["PLR2004"]
"src/pynescript/ast/evaluator/builtins/input.py" = ["PLR2004"]
"src/pynescript/ast/evaluator/builtins/numeric.py" = ["PLR2004"]

[tool.coverage.run]
source_pkgs = ["pynescript", "tests"]
branch = true
parallel = true
omit = [
  "src/pynescript/__about__.py",
]

[tool.coverage.paths]
pynescript = ["src/pynescript", "*/pynescript/src/pynescript"]
tests = ["tests", "*/pynescript/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
exclude = []

[[tool.mypy.overrides]]
module = [
  "pynescript.ast.grammar.antlr4.generated.*",
  "pynescript.ast.grammar.asdl.generated.*",
  "pynescript.ast.grammar.antlr4.resource.*",
  "pynescript.ast.grammar.antlr4.error_listener",
  "pynescript.ast.grammar.asdl.tool.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "tests.*",
]
check_untyped_defs = false
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "pynescript.ast.helper",
  "pynescript.ast.builder",
]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = [
  "pynescript.ast.evaluator.builtins.*",
]
warn_return_any = false
disable_error_code = [
  "arg-type",
  "assignment",
  "attr-defined",
  "dict-item",
  "index",
  "operator",
  "return-value",
  "type-var",
  "union-attr",
  "var-annotated",
]

[[tool.mypy.overrides]]
module = [
  "antlr4.*",
  "pytest.*",
  "nautilus_trader.*",
  "pyasdl.*",
]
ignore_missing_imports = true
