[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynescript"
dynamic = ["version"]
description = "Parse, inspect, and regenerate TradingView® Pine Script™ from Python"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["python", "tradingview", "pinescript"]
authors = [
  { name = "jango-blockchained" },
]
maintainers = [
  { name = "jango-blockchained" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = [
  "antlr4-python3-runtime>=4.13.1",
  "click>=8.1.7",
  "requests",
  "tqdm",
]

[project.urls]

[project.scripts]
pynescript = "pynescript.__main__:cli"

[project.entry-points."pygments.lexers"]
pinescript = "pynescript.ext.pygments.lexers:PinescriptLexer"

[tool.hatch.version]
path = "src/pynescript/__about__.py"

[tool.hatch.envs.test]
dependencies = [
  "coverage[toml]>=7.4.2",
  "pytest>=8.0.1",
  "pytest-cov>=4.1.0",
  "pytest-xdist>=3.5.0",
]
[tool.hatch.envs.test.scripts]
test = [
  "pytest {args}",
]
test-cov = [
  "pytest -n auto -d --cov=src/pynescript --cov=tests --cov-report=term --cov-report=lcov {args:tests}",
]
cov = [
  "coverage run -m pytest {args:tests}",
  "coverage combine",
  "coverage lcov",
  "coverage report",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12"]

[tool.hatch.envs.lint]
detached = true
dependencies = [
  "antlr4-cli",
  "black>=24.2.0",
  "mypy>=1.8.0",
  "pyasdl>=0.3.1",
  "ruff>=0.2.2",
]
[tool.hatch.envs.lint.scripts]
gen-parser = "antlr4 {args}"
style = "ruff check {args}"
typing = "mypy --install-types --non-interactive {args:src/pynescript tests}"
format = "ruff format {args}"

[tool.hatch.envs.docs]
detached = true
dependencies = [
  "furo>=2024.1.29",
  "myst-parser>=2.0.0",
  "pygments>=2.17.2",
  "sphinx>=7.2.6",
  "sphinx-click>=5.1.0",
  "sphinx-autobuild>=2024.2.4",
  "antlr4-python3-runtime>=4.13.1",
]

[tool.hatch.envs.docs.scripts]
build = [
  "sphinx-build docs docs/_build",
]

[tool.black]
target-version = ["py310"]
line-length = 120
skip-string-normalization = true

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  "generated",
  "src/pynescript/ast/evaluator_backup.py",
]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  "ISC001",
]

[tool.ruff.lint.isort]
known-first-party = ["pynescript"]
force-single-line = true
lines-between-types = 1
lines-after-imports = 2
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ARG001", "C901", "F841", "PLR0912", "PLR2004", "S101", "T201", "TID252"]
"src/pynescript/__main__.py" = ["PLC0415"]
"src/pynescript/ast/__main__.py" = ["PLC0415"]
"src/pynescript/ast/evaluator/**/*.py" = ["N802"]
"src/pynescript/ast/evaluator/builtins/**/*.py" = ["PLR2004"]
"src/pynescript/ast/evaluator/statements.py" = ["C901", "N818"]
"src/pynescript/ast/evaluator/builtins/technical_submodules/advanced.py" = ["C901", "PLR0912", "PLR0915"]
"src/pynescript/ast/evaluator/builtins/technical_refactored.py" = ["PLC0415"]
"src/pynescript/ast/helper.py" = ["C901", "PLC0415", "PLR1704"]
"src/pynescript/ast/type_system.py" = ["FBT001", "FBT002"]

[tool.coverage.run]
source_pkgs = ["pynescript", "tests"]
branch = true
parallel = true
omit = [
  "src/pynescript/__about__.py",
]

[tool.coverage.paths]
pynescript = ["src/pynescript", "*/pynescript/src/pynescript"]
tests = ["tests", "*/pynescript/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
exclude = [
    "src/pynescript/ast/evaluator_backup\\.py$",
]

[[tool.mypy.overrides]]
module = [
  "pynescript.ast.grammar.antlr4.generated.*",
  "pynescript.ast.grammar.asdl.generated.*",
  "pynescript.ast.grammar.antlr4.resource.*",
  "pynescript.ast.grammar.antlr4.error_listener",
  "pynescript.ast.grammar.asdl.tool.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "tests.*",
]
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
  "pynescript.ast.helper",
  "pynescript.ast.builder",
]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = [
  "pynescript.ast.evaluator.builtins.*",
]
warn_return_any = false
disable_error_code = [
  "arg-type",
  "assignment",
  "attr-defined",
  "dict-item",
  "index",
  "operator",
  "return-value",
  "type-var",
  "union-attr",
  "var-annotated",
]

[[tool.mypy.overrides]]
module = [
  "antlr4.*",
  "pytest.*",
  "nautilus_trader.*",
  "pyasdl.*",
]
ignore_missing_imports = true
