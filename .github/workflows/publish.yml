# Publish hoox-pyne (import: pynescript) to PyPI on version tags (v*).
#
# Prerequisites (one-time):
#   1. PyPI Pending Trusted Publisher for project "hoox-pyne":
#        Owner: hoox-sh  Repo: pyne  Workflow: publish.yml  Environment: pypi
#   2. GitHub environment "pypi" on hoox-sh/pyne (optional protection rules).
#   Note: PyPI "pynescript" = elbakramer; "pyne"/"PyNE" = unrelated 0.1.0 lib.
#         This project ships as **hoox-pyne** (import/CLIs stay pynescript).
#   Note: Owner must match the GitHub org (hoox-sh), not a personal account.
#
# Usage:
#   git tag v0.3.0 && git push origin v0.3.0
#   # or: Actions → Publish → Run workflow

name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only (skip PyPI upload)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist + wheel
        shell: bash
        run: |
          set -euo pipefail
          pip install build twine
          python -m build
          twine check dist/*
          test -n "$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | head -1)"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: hoox-pyne-release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 5

  publish-pypi:
    name: Upload to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    # Skip dry-run dispatches; always publish on real version tags.
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    environment:
      name: pypi
      url: https://pypi.org/project/hoox-pyne/
    permissions:
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: hoox-pyne-release-dist
          path: dist

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
