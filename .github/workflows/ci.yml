name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/pyne/versions.json"
      - "docs/pyne/snippets/package-versions.jsx"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tools
        run: pip install "ruff>=0.2.2" "mypy>=1.8.0" types-python-dateutil antlr4-python3-runtime

      - name: Ruff (correctness gate)
        # Full style set still has legacy debt across evaluator/compiler; CI gates
        # pyflakes-class errors (E/F/W) so public main stays green. Local: make lint.
        run: |
          ruff check src/ tests/ backend/middleware/auth.py \
            --select E,F,W \
            --ignore E501,E741,F841,W293,E402 \
            --output-format=github

      - name: Type check (package)
        # Non-blocking until mypy debt is cleared; fails the step only on hard errors if any.
        run: mypy src/ --ignore-missing-imports || true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: |
          pip install -e ".[lsp,pro,compile]"
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-xdist pytest-asyncio

      - name: Core unit tests
        # Intentionally omit corpus-parametrized tests (test_parse_and_unparse, etc.)
        # — those are hundreds of *.pine cases; run locally with `make test`.
        run: |
          python -m pytest \
            tests/test_linter.py \
            tests/test_evaluator.py \
            tests/test_cli.py \
            -q --tb=short

      - name: Core runtime (parity / strategy / series)
        # Audit 2026-08-10 Wave A: PR-gate first-party correctness without
        # third-party corpora. Skips optional corpus cases when files absent.
        # Wave B+: full ``_ema`` SMA-seed aligned with incremental/numba; TA
        # bar-mode goldens (EMA/ATR/KC/…) gate dual-host residual.
        run: |
          python -m pytest \
            tests/test_interp_compile_parity.py \
            tests/test_parity.py \
            tests/test_expr_parity_r8.py \
            tests/test_strategy_runtime.py \
            tests/test_order_fills.py \
            tests/test_series_cap.py \
            tests/test_series_ring_buffer.py \
            tests/test_alert_forwarder.py \
            tests/test_free_limits.py \
            tests/test_ta_incremental.py \
            tests/test_first_party_ta_goldens.py \
            tests/test_runtime_package.py \
            -q --tb=short \
            -k "not optional_corpus"
        env:
          # Keep free-tier rate limits out of the way for unit tests.
          FREE_RATE_LIMIT: "0"
          FREE_MAX_CONCURRENT: "0"
          ADMIN_TOKEN: ci-test-admin-token

      - name: LSP tests
        run: |
          python -m pytest \
            tests/test_langserver.py \
            tests/test_lsp_features.py \
            -v --tb=short

      - name: Backend / Pro API tests
        run: |
          python -m pytest tests/test_backend.py tests/test_alert_forwarder.py tests/test_free_limits.py -v --tb=short \
            --cov=backend --cov=src/pynescript \
            --cov-report=xml --cov-report=term-missing:skip-covered
        env:
          ADMIN_TOKEN: ci-test-admin-token
          FREE_RATE_LIMIT: "0"
          FREE_MAX_CONCURRENT: "0"

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  package:
    name: Package (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          pip install build twine
          python -m build
          twine check dist/*

      - name: Smoke-import wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/pynescript-wheel
          /tmp/pynescript-wheel/bin/pip install dist/*.whl
          /tmp/pynescript-wheel/bin/python -c "import pynescript; print('version', pynescript.__version__)"
          /tmp/pynescript-wheel/bin/pynescript --help

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pynescript-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker (api + cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/pynescript/__about__.py)
          test -n "$VER"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Building Docker images with PYNESCRIPT_VERSION=${VER}"

      - name: Build production API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api
          push: false
          load: true
          provenance: false
          sbom: false
          tags: pynescript-api:ci
          build-args: |
            PYNESCRIPT_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke (API health)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name pynescript-api-ci \
            -e ADMIN_TOKEN=ci-smoke-token \
            -e STORE_BACKEND=json \
            -e API_KEY_STORE=/tmp/api_keys.json \
            -p 18080:8080 \
            pynescript-api:ci
          cleanup() { docker rm -f pynescript-api-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then ok=1; break; fi
            sleep 2
          done
          docker logs pynescript-api-ci 2>&1 | tail -40
          test "$ok" = "1"
          # Admin minting is fail-closed without token
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/auth/create_key \
            -H 'Content-Type: application/json' -d '{"tier":"hobby"}')
          test "$code" = "403"
          # With admin token succeeds
          curl -fsS -X POST http://127.0.0.1:18080/auth/create_key \
            -H 'Content-Type: application/json' \
            -H 'X-Admin-Token: ci-smoke-token' \
            -d '{"tier":"hobby"}' | head -c 200
          echo

      - name: Build CLI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: cli
          push: false
          load: true
          provenance: false
          sbom: false
          tags: pynescript-cli:ci
          build-args: |
            PYNESCRIPT_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke (CLI)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network=none pynescript-cli:ci --help
          docker run --rm --network=none pynescript-cli:ci info
          # Image runs as uid 1000 (appuser). mktemp dirs are mode 0700 by default,
          # so non-root containers get PermissionError on bind-mounted paths —
          # open the dir and file for others (read + traverse).
          TMP=$(mktemp -d)
          chmod 755 "$TMP"
          printf '%s\n' '//@version=5' 'indicator("ci")' 'plot(close)' > "$TMP/smoke.pine"
          chmod 644 "$TMP/smoke.pine"
          docker run --rm --network=none \
            -v "$TMP:/work:ro" -w /work \
            pynescript-cli:ci check smoke.pine -q

  vscode-ext-test:
    name: VS Code Extension Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install, compile, package
        working-directory: vscode-extension
        run: |
          npm ci
          npm run compile
          npx vsce package --allow-missing-repository --no-git-tag-version

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: pynescript-vsix
          path: vscode-extension/*.vsix
          if-no-files-found: error
          retention-days: 7
