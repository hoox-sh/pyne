#
# Build and push PYNE container images to GitHub Container Registry.
#
# Images:
#   ghcr.io/hoox-sh/pyne/api:<version>  (and :latest on tags / default dispatch)
#   ghcr.io/hoox-sh/pyne/cli:<version>
#   ghcr.io/hoox-sh/pyne/lsp:<version>
#
# Triggers:
#   - push of v* tags
#   - workflow_dispatch (manual)
#
# Pull (public packages):
#   docker pull ghcr.io/hoox-sh/pyne/cli:0.3.0
#   docker run --rm -v "$PWD:/work" -w /work ghcr.io/hoox-sh/pyne/cli:0.3.0 check script.pine

name: GHCR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_latest:
        description: "Also push :latest tags"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  push:
    name: Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            image: api
          - target: cli
            image: cli
          - target: lsp
            image: lsp
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
            TAG_LATEST=true
          else
            VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/pynescript/__about__.py)
            test -n "$VER"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              TAG_LATEST="${{ inputs.tag_latest }}"
            else
              TAG_LATEST=false
            fi
          fi
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}"
          # lowercase (GHCR requires lowercase image names)
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          {
            echo "version=${VER}"
            echo "image=${IMAGE}"
            echo "tag_latest=${TAG_LATEST}"
          } >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE} version=${VER} latest=${TAG_LATEST}"

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=latest,enable=${{ steps.meta.outputs.tag_latest }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            PYNESCRIPT_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=ghcr-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.image }}

      - name: Smoke CLI (amd64, version tag)
        if: matrix.image == 'cli'
        shell: bash
        run: |
          set -euo pipefail
          IMG="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
          docker run --rm --platform linux/amd64 --network=none "$IMG" --help
          docker run --rm --platform linux/amd64 --network=none "$IMG" info

      - name: Smoke LSP (amd64, version tag)
        if: matrix.image == 'lsp'
        shell: bash
        run: |
          set -euo pipefail
          IMG="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
          docker run --rm --platform linux/amd64 --network=none --entrypoint python "$IMG" \
            -c "import pynescript.langserver; print('lsp-ok')"
