name: Build & Release LSP

on:
  push:
    tags:
      - "v*"  # e.g., v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 1.0.0)"
        required: true
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NUITKA_JOBS: 4

jobs:
  build-lsp:
    name: Build LSP Binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: pynescript-lsp-linux-x86_64
          - os: windows-latest
            artifact_name: pynescript-lsp-windows-x86_64.exe
          - os: macos-latest
            artifact_name: pynescript-lsp-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          pip install nuitka==2.0.* cryptography

      - name: Build metadata & encrypt
        run: python scripts/build/compile.py --no-encrypt --check
        env:
          CRYPTO_KEY: ${{ secrets.METADATA_KEY }}

      - name: Build onefile binary
        run: |
          python scripts/build/ci_build.py --jobs ${{ env.NUITKA_JOBS }}
        env:
          CRYPTO_KEY: ${{ secrets.METADATA_KEY }}

      - name: Find binary
        id: find_binary
        run: |
          BINARY=$(find dist -name "pynescript-lsp*" -type f -executable | head -1)
          if [ -z "$BINARY" ]; then
            BINARY=$(find dist -name "pynescript-lsp*" | head -1)
          fi
          echo "binary=$BINARY" >> $GITHUB_OUTPUT
          echo "Found: $BINARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.find_binary.outputs.binary }}
          retention-days: 5

  build-vscode:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile TypeScript
        working-directory: vscode-extension
        run: npm run compile

      - name: Package extension
        working-directory: vscode-extension
        run: npx vsce package --allow-missing-repository --no-git-tag-version
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pynescript-vscode-extension
          path: vscode-extension/*.vsix
          retention-days: 5

  release:
    name: Create Release
    needs: [build-lsp, build-vscode]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Pynescript LSP v${{ steps.version.outputs.version }}"
          body: |
            ## Pynescript Language Server v${{ steps.version.outputs.version }}

            Pre-built binaries for the Pine Script LSP server.

            ### Downloads
            - `pynescript-lsp-linux-x86_64` — Linux binary
            - `pynescript-lsp-windows-x86_64.exe` — Windows binary
            - `pynescript-lsp-macos-arm64` — macOS ARM binary
            - `pynescript-vscode-extension.vsix` — VS Code extension

            ### Installation

            **VS Code / Antigravity:**
            1. Download the `.vsix` file
            2. Install: `code --install-extension pynescript-*.vsix`

            **Standalone LSP:**
            ```bash
            # Linux
            chmod +x pynescript-lsp-linux-x86_64
            sudo mv pynescript-lsp-linux-x86_64 /usr/local/bin/pynescript-lsp

            # Verify
            pynescript-lsp --help
            ```

            ### What's New
            - Full Pine Script LSP with diagnostics, autocomplete, hover
            - 482 builtins across 20 categories
            - Formatting, go-to-definition, find references
            - VS Code + Neovim + Zed + Emacs support

          draft: false
          prerelease: false
          files: |
            artifacts/pynescript-lsp-linux-x86_64/*
            artifacts/pynescript-lsp-windows-x86_64.exe/*
            artifacts/pynescript-lsp-macos-arm64/*
            artifacts/pynescript-vscode-extension/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-vscode:
    name: Publish to VS Code Marketplace
    needs: [build-vscode]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: pynescript-vscode-extension
          path: .

      - name: Publish to Marketplace
        run: npx vsce publish --pat ${{ secrets.VSCE_PAT }}
        working-directory: .
