name: Build & Release LSP

on:
  push:
    tags:
      - "v*"  # e.g., v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 1.0.0)"
        required: true
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nuitka 2.0.x supports up to 3.11; 3.12 needs a newer Nuitka pin.
  PYTHON_VERSION: "3.11"
  NUITKA_JOBS: 4

jobs:
  build-lsp:
    name: Build LSP Binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: pynescript-lsp-linux-x86_64
          - os: windows-latest
            artifact_name: pynescript-lsp-windows-x86_64.exe
          - os: macos-latest
            artifact_name: pynescript-lsp-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # LSP-only (no numba/compiler) — smaller Nuitka graph, avoids broken macOS
          # cryptography/llvmlite packaging for an editor binary that only needs parse+lint.
          python -m pip install -e ".[lsp]"
          python -m pip install "nuitka==2.0.*" cryptography

      - name: Build metadata & encrypt
        run: python scripts/build/compile.py --no-encrypt --check
        env:
          CRYPTO_KEY: ${{ secrets.METADATA_KEY }}
          PYTHONPATH: ${{ github.workspace }}/src

      - name: Build onefile binary
        run: |
          python scripts/build/ci_build.py --jobs ${{ env.NUITKA_JOBS }}
        env:
          CRYPTO_KEY: ${{ secrets.METADATA_KEY }}
          PYTHONPATH: ${{ github.workspace }}/src

      - name: Find binary and rename to platform artifact name
        id: find_binary
        shell: bash
        run: |
          set -euo pipefail
          BINARY=$(find dist -name "pynescript-lsp*" -type f \( -perm -111 -o -name "*.exe" \) 2>/dev/null | head -1)
          if [ -z "$BINARY" ]; then
            BINARY=$(find dist -name "pynescript-lsp*" -type f | head -1)
          fi
          if [ -z "$BINARY" ] || [ ! -f "$BINARY" ]; then
            echo "No pynescript-lsp binary under dist/" >&2
            ls -laR dist || true
            exit 1
          fi
          # Always ship under a unique platform name so GitHub Release assets
          # do not collide (all platforms otherwise produce "pynescript-lsp").
          DEST="dist/${{ matrix.artifact_name }}"
          mkdir -p dist
          cp -f "$BINARY" "$DEST"
          chmod +x "$DEST" 2>/dev/null || true
          echo "binary=$DEST" >> "$GITHUB_OUTPUT"
          echo "Found: $BINARY -> $DEST ($(wc -c < "$DEST") bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.find_binary.outputs.binary }}
          if-no-files-found: error
          retention-days: 5

  build-vscode:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile TypeScript
        working-directory: vscode-extension
        run: npm run compile

      - name: Package extension
        working-directory: vscode-extension
        run: npx vsce package --allow-missing-repository --no-git-tag-version
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pynescript-vscode-extension
          path: vscode-extension/*.vsix
          retention-days: 5

  release:
    name: Create Release
    needs: [build-lsp, build-vscode]
    runs-on: ubuntu-latest
    # Ship whatever artifacts succeeded (matrix is fail-fast: false).
    if: >
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-vscode.result == 'success'
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Stage release files with stable names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Platform binaries (already renamed at upload time).
          for name in \
            pynescript-lsp-linux-x86_64 \
            pynescript-lsp-windows-x86_64.exe \
            pynescript-lsp-macos-arm64
          do
            if [ -d "artifacts/$name" ]; then
              f=$(find "artifacts/$name" -type f | head -1 || true)
              if [ -n "${f:-}" ] && [ -f "$f" ]; then
                cp -f "$f" "release-assets/$name"
                chmod +x "release-assets/$name" 2>/dev/null || true
                echo "staged $name ($(wc -c < "release-assets/$name") bytes)"
              fi
            fi
          done
          # VSIX — prefer pyne-*.vsix, skip tiny junk.
          if [ -d artifacts/pynescript-vscode-extension ]; then
            vsix=$(find artifacts/pynescript-vscode-extension -name 'pyne-*.vsix' -type f | head -1 || true)
            if [ -z "${vsix:-}" ]; then
              vsix=$(find artifacts/pynescript-vscode-extension -name '*.vsix' -type f -size +50k | head -1 || true)
            fi
            if [ -n "${vsix:-}" ]; then
              base=$(basename "$vsix")
              cp -f "$vsix" "release-assets/$base"
              echo "staged $base"
            fi
          fi
          ls -la release-assets/

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "pyne v${{ steps.version.outputs.version }}"
          body: |
            ## PYNE v${{ steps.version.outputs.version }}

            First public **PYNE** release (import/CLIs: `pynescript` / `pynescript-lsp`;
            PyPI distribution: **`hoox-pyne`**).

            ### Install
            ```bash
            pip install "hoox-pyne[lsp]==${{ steps.version.outputs.version }}"
            # or from this release's wheel if PyPI is not yet available
            ```

            ### Downloads
            - `pynescript-lsp-linux-x86_64` — Linux LSP binary
            - `pynescript-lsp-windows-x86_64.exe` — Windows LSP binary
            - `pynescript-lsp-macos-arm64` — macOS ARM LSP binary
            - `pyne-*.vsix` — VS Code extension

            ### VS Code
            1. Download the `.vsix`
            2. `code --install-extension pyne-*.vsix`
            3. Language server: `pip install "hoox-pyne[lsp]"` or the standalone binary

            ### Standalone LSP
            ```bash
            chmod +x pynescript-lsp-linux-x86_64
            sudo mv pynescript-lsp-linux-x86_64 /usr/local/bin/pynescript-lsp
            pynescript-lsp --help
            ```

            See [CHANGELOG.md](https://github.com/hoox-sh/pyne/blob/main/CHANGELOG.md) for full notes.

          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-vscode:
    name: Publish to VS Code Marketplace
    needs: [build-vscode]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: pynescript-vscode-extension
          path: .

      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "VSCE_PAT not set — skipping Marketplace publish (VSIX still on GitHub Release)."
            exit 0
          fi
          npx --yes @vscode/vsce publish --pat "$VSCE_PAT"
